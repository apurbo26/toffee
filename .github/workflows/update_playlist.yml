name: Auto Update Toffee Playlist

on:
  schedule:
    # প্রতি ৩ ঘণ্টা পর পর রান হবে (UTC সময় অনুযায়ী)
    - cron: '0 */3 * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run PHP Script
        run: php process_m3u.php

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add toffee_playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto updated Toffee playlist" && git push)
          
