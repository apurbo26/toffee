<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toffee Playlist Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #e91e63;
            text-align: center;
        }
        .link-box {
            background: #eef2f3;
            padding: 15px;
            border-radius: 5px;
            word-break: break-all;
            margin: 20px 0;
            font-family: monospace;
        }
        .btn {
            display: inline-block;
            background: #e91e63;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin: 5px 0;
        }
        .btn:hover {
            background: #d81b60;
        }
        pre {
            background: #272822;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 5px;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Toffee Live M3U Playlist</h1>
    <p>Ei playlist-ti protinoto GitHub Actions er মাধ্যমে প্রতি ৩ ঘণ্টা পর পর অটো-আপডেট হয়।</p>
    
    <h3>Apnar M3U Direct Link:</h3>
    <div class="link-box" id="m3uLink">Loading link...</div>
    <a href="#" id="downloadBtn" class="btn" download="toffee_playlist.m3u">Download M3U File</a>

    <h3>Live Playlist Preview (Last Updated):</h3>
    <pre id="playlistContent">Loading playlist content...</pre>
</div>

<script>
    // GitHub Raw Link automatic generate korar jonno
    const username = window.location.hostname.split('.')[0];
    const repoParts = window.location.pathname.split('/');
    const repo = repoParts[1] || '';
    
    // Jodi GitHub Pages local ba custom domain hoy, tar jonno direct link
    const rawUrl = `https://raw.githubusercontent.com/${username}/${repo}/main/toffee_playlist.m3u`;
    
    document.getElementById('m3uLink').innerText = rawUrl;
    document.getElementById('downloadBtn').href = rawUrl;

    // M3U file-er content webpage-e dekhanor jonno
    fetch('toffee_playlist.m3u?' + new Date().getTime())
        .then(response => response.text())
        .then(data => {
            document.getElementById('playlistContent').innerText = data;
        })
        .catch(error => {
            document.getElementById('playlistContent').innerText = 'Playlist load korte somossa hocche.';
        });
</script>

</body>
  </html>
